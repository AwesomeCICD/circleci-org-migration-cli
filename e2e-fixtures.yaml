# e2e-fixtures.yaml
#
# Test topology for the circleci-migrate CLI: the CircleCI orgs, GitHub orgs, and
# repos used for live/manual testing today, plus the dedicated dummy orgs we want
# to stand up for repeatable end-to-end (e2e) tests.
#
# RULES
#   - NO SECRETS in this file. API tokens come from the environment only:
#       CIRCLECI_SOURCE_TOKEN / CIRCLECI_DEST_TOKEN (fallback: CIRCLECI_CLI_TOKEN)
#       GITHUB_TOKEN (for GitHub App external_id resolution)
#   - Prefer the dedicated `fixtures` below for anything automated; the
#     `known_dev_resources` are real-ish accounts used for ad-hoc dev testing.
#
# Slug forms: GitHub OAuth orgs are "gh/<name>"; GitHub App / standalone orgs are
# "circleci/<org-uuid>" and their projects are "circleci/<org-uuid>/<proj-uuid>".

schema_version: 1

auth:
  # Names of the env vars to read; never the values.
  source_token_env: CIRCLECI_SOURCE_TOKEN
  dest_token_env: CIRCLECI_DEST_TOKEN
  github_token_env: GITHUB_TOKEN

# ---------------------------------------------------------------------------
# Nightly live-e2e (CI) — consumed by .circleci/nightly_config.yml (#195).
#
# The nightly workflow runs ONLY when a Scheduled Pipeline trigger sets the
# pipeline parameter run-nightly-e2e=true; it then runs `export` +
# `sync --dry-run` (no --apply, zero writes) against the orgs below.
#
# Provisioning (one-time, by an org owner — NO secrets committed here):
#   1. Create a CircleCI context named exactly "e2e-live" containing:
#        E2E_CIRCLE_TOKEN  (required) — minimally-scoped CircleCI API token that
#                                       can read source_org and dest_org.
#        E2E_SOURCE_ORG    (required) — source.circleci_slug below.
#        E2E_DEST_ORG      (required) — dest.circleci_slug below.
#        E2E_DEST_TOKEN    (optional) — separate dest token; if omitted the dry
#                                       run reuses E2E_CIRCLE_TOKEN for both.
#   2. Create a Scheduled Pipeline trigger on `main` passing run-nightly-e2e=true.
#
# Until both exist the nightly path never runs; if triggered without
# E2E_CIRCLE_TOKEN the job halts cleanly (success), so it can never go red.
nightly_ci:
  context: e2e-live
  pipeline_parameter: run-nightly-e2e
  required_env:
    - E2E_CIRCLE_TOKEN
    - E2E_SOURCE_ORG
    - E2E_DEST_ORG
  optional_env:
    - E2E_DEST_TOKEN
  source_org: gh/gh-oauth-cci-1   # designated throwaway OAuth org (read-only here)
  dest_org: gh/gh-oauth-cci-2     # designated throwaway OAuth org (dry-run target)

# ---------------------------------------------------------------------------
# Dedicated dummy orgs for repeatable testing / future e2e. Two per scenario:
# a SOURCE (populated with test data) and a DEST (empty, receives the migration).
# Fill in slugs/org_ids as these are provisioned. Keep test data synthetic — no
# real secrets; use throwaway repos with a trivial .circleci/config.yml.
# ---------------------------------------------------------------------------
fixtures:
  oauth_to_oauth:
    description: GitHub OAuth org -> GitHub OAuth org (same-type). Used by the
      nightly live-e2e (export + sync --dry-run). These are dedicated throwaway
      OAuth orgs with matching repo names in both GitHub orgs.
    source:
      circleci_slug: gh/gh-oauth-cci-1
      github_org: gh-oauth-cci-1
      org_id: TBD
    dest:
      circleci_slug: gh/gh-oauth-cci-2
      github_org: gh-oauth-cci-2
      org_id: TBD
    repos: []              # throwaway repos present in BOTH GitHub orgs
    seed:                  # synthetic data to create in source before a test
      contexts: ["e2e-shared", "e2e-deploy"]
      project_env_vars: ["E2E_FAKE_TOKEN", "E2E_REGION"]

  app_to_app:
    description: GitHub App / standalone org -> GitHub App org (same-type). Needs
      the CircleCI GitHub App installed on the throwaway repos in both GitHub orgs
      so pipeline-definitions/triggers have a real external_id.
    source:
      circleci_slug: TBD   # circleci/<src-org-uuid>
      github_org: TBD
      org_id: TBD
    dest:
      circleci_slug: TBD   # circleci/<dst-org-uuid>
      github_org: TBD
      org_id: TBD
    repos: []
    seed:
      contexts: ["e2e-shared"]
      pipeline_definitions: true   # at least one repo with .circleci/config.yml

# ---------------------------------------------------------------------------
# Roles used for ad-hoc live testing during development. Fill in slugs/org_ids
# with your OWN orgs before running anything live — these are placeholders, not
# real accounts. Treat any org you point at the "source" roles as read-only and
# only use a throwaway org for the "dest-writable" role. Do NOT run destructive
# operations against an org that holds real config.
# ---------------------------------------------------------------------------
known_dev_resources:
  - name: writable-dummy
    circleci_slug: circleci/<DEST_ORG_UUID>
    org_id: <DEST_ORG_ID>
    vcs_type: circleci
    role: dest-writable-dummy
    notes: >-
      A throwaway standalone/App org that is safe for write tests (sync --apply,
      project create/delete). Provision a dedicated org for this — never reuse
      one with real config. Connect a repo to it if you need to live-test
      pipeline-definition / trigger creation.

  - name: oauth-source
    circleci_slug: gh/<your-org>
    org_id: <SOURCE_ORG_ID>
    vcs_type: github
    role: oauth-source-readonly
    notes: Any GitHub OAuth org you control; used for export/read tests only.

  - name: app-source
    circleci_slug: circleci/<SOURCE_ORG_UUID>
    org_id: <SOURCE_ORG_ID>
    vcs_type: circleci
    role: app-source-readonly
    notes: >-
      A GitHub App / standalone org with connected repos + pipeline-definitions/
      triggers, used to validate capture. Read/export only — not designated for
      create/delete tests.

  - name: ci-host
    circleci_slug: gh/<your-ci-org>
    org_id: <CI_HOST_ORG_ID>
    vcs_type: github
    role: ci-host
    notes: The org that hosts this repo's CI and the orb namespace.
